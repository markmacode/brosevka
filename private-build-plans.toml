[buildPlans.Brosevka]
family = "Brosevka"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

[buildPlans.Brosevka.variants.design]
capital-q = "crossing-curly-tailed"
y = "straight-turn-serifless"
brace = "curly-flat-boundary"
bar = "force-upright"
lig-ltgteq = "flat"

[buildPlans.Brosevka.variants.italic]
h = "tailed-serifless"
m = "tailed-serifless"
n = "tailed-serifless"
q = "tailed-serifless"
r = "corner-hooked-serifless"
v = "cursive-serifless"
w = "cursive-serifless"
x = "semi-chancery-curly-serifless"
y = "cursive-serifless"
z = "cursive"
three = "flat-top-serifless"
six = "open-contour"
seven = "bend-serifless"
nine = "open-contour"

[buildPlans.Brosevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Brosevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.Brosevka.widths.Normal]
shape = 548
menu = 5
css = "normal"
