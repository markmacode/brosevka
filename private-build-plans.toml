[buildPlans.Brosevka]
family = "Brosevka"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = false

[buildPlans.Brosevka.variants]
inherits = "ss14"

[buildPlans.Brosevka.variants.design]
capital-j = "serifed"
capital-q = "crossing-curly-tailed"
capital-w = "straight-serifless"
capital-x = "curly-serifless"
w = "straight-serifless"
y = "straight-turn-serifless"
zero = "slashed"
asterisk = "penta-high"
paren = "normal"
brace = "curly-flat-boundary"
bar = "force-upright"
lig-ltgteq = "flat"

[buildPlans.Brosevka.variants.italic]
capital-a = "curly-serifless"
capital-b = "more-asymmetric-serifless"
capital-d = "standard-serifless"
capital-j = "serifed"
capital-k = "curly-serifless"
capital-v = "curly-serifless"
capital-x = "curly-serifless"
capital-y = "curly-serifless"
capital-z = "curly-serifless"
d = "toothed-bottom-serifed"
f = "flat-hook-tailed"
g = "double-storey-open"
h = "tailed-serifless"
i = "serifed-diagonal-tailed"
j = "diagonal-tailed-serifed"
l = "serifed-diagonal-tailed"
m = "tailed-serifless"
n = "tailed-serifless"
q = "earless-corner-tailed-serifless"
r = "corner-hooked-serifless"
s = "serifless"
t = "diagonal-tailed"
u = "tailed-serifless"
v = "cursive-serifed"
w = "cursive-serifless"
x = "semi-chancery-straight-serifless"
y = "cursive-serifless"
z = "curly-serifless"
two = "curly-neck-serifless"
three = "flat-top-serifless"
six = "open-contour"
seven = "bend-serifless"
nine = "open-contour"

[buildPlans.Brosevka.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.Brosevka.widths.Extended]
shape = 600
menu = 7
css = "expanded"

[buildPlans.Brosevka.widths.SemiExtended]
shape = 548
menu = 6
css = "semi-expanded"

[buildPlans.Brosevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
